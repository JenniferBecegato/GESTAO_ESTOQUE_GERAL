function table(ps){return `<table><tr><th>Produto</th><th>Categoria</th><th>Saldo</th><th>Mínimo</th><th>Situação</th></tr>${ps.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.cat)}</td><td>${p.saldo} ${esc(p.un)}</td><td>${p.min}</td><td>${p.saldo<=p.min?'<span class="tag">Estoque baixo</span>':'Normal'}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum produto encontrado.</td></tr>'}</table>`}function atualizaLista(){let q=document.querySelector('#busca').value.toLowerCase();document.querySelector('#lista').innerHTML=table(produtos.filter(p=>(p.nome+' '+p.code).toLowerCase().includes(q)))}function cadastrar(){let code=document.querySelector('#code').value.trim(),nome=document.querySelector('#nome').value.trim(),un=document.querySelector('#un').value.trim(),min=Number(document.querySelector('#min').value),factor=Number(document.querySelector('#factor').value),emb=document.querySelector('#emb').value;if(!code||!nome||!un||!Number.isInteger(min)||min<0||(emb&&(!Number.isInteger(factor)||factor<1))){alert('Preencha código, nome, unidade e quantidades válidas.');return}if(produtos.some(p=>p.code===code)){alert('Este código já está cadastrado.');return}produtos.push({code,nome,un,min,factor,emb,cat:document.querySelector('#cat').value,saldo:0});document.querySelector('#msg').textContent='Produto cadastrado na simulação. Registre o saldo inicial em Entrada.'}function buscar(){let code=document.querySelector('#codigo').value.trim();selected=produtos.find(p=>p.code===code);document.querySelector('#msg').textContent='';document.querySelector('#formmov').classList.toggle('hide',!selected);document.querySelector('#produto').innerHTML=selected?`<p><b>${esc(selected.nome)}</b> · Saldo: ${selected.saldo} ${esc(selected.un)} · Local: ${esc(selected.local)}</p>`:`<p>Produto não encontrado. Confira o código ou <button class="action secondary" onclick="show(2)">cadastre o produto</button>.</p>`;if(selected){document.querySelector('#tipoemb').innerHTML=`<option value="1">${esc(selected.un)} (unidade de controle)</option>`+(selected.emb?`<option value="${selected.factor}">${esc(selected.emb)} — ${selected.factor} ${esc(selected.un)}</option>`:'');calc()}}function calc(){if(selected)document.querySelector('#calc').textContent=`Equivale a ${Number(document.querySelector('#q').value)*Number(document.querySelector('#tipoemb').value)} ${selected.un} no estoque.`}function movimentar(){let q=Number(document.querySelector('#q').value),factor=Number(document.querySelector('#tipoemb').value),total=q*factor;if(!Number.isInteger(q)||q<=0){alert('Informe uma quantidade inteira positiva.');return}if(current===4&&total>selected.saldo){alert('Quantidade maior que o saldo disponível.');return}selected.saldo+=current===3?total:-total;hist.unshift({tipo:current===3?'Entrada':'Saída',nome:selected.nome,q:total,un:selected.un,data:new Date().toLocaleString('pt-BR')});document.querySelector('#msg').textContent=`Movimentação registrada na simulação. Novo saldo: ${selected.saldo} ${selected.un}.`;document.querySelector('#formmov').classList.add('hide');document.querySelector('#produto').innerHTML='';selected=null}
let descricao=`<article class="content">${header('Projeto do sistema de estoque geral','Descrição estrutural e funcional — proposta para desenvolvimento em Windows Forms')}<div class="notice">Este documento descreve o sistema planejado. As demais telas são um protótipo para visualizar a proposta; não substituem o programa desktop final.</div><h2>1. Objetivo e ambiente</h2><p>Controlar materiais de uso interno da farmácia, como folhas, fitas, canetas, produtos de limpeza, panos, rodos, vassouras, papel higiênico, capas descartáveis e café. O sistema registra o que entra, o que é retirado, o saldo disponível e os produtos que precisam ser comprados.</p><p>Será utilizado em um único computador Windows, próximo ao estoque, funcionando localmente. A proposta usa C# com Windows Forms para as telas e SQLite para armazenar os dados em um arquivo no computador. Não depende de internet para as operações locais.</p><h2>2. Leitura de código</h2><p>Inicialmente, a pessoa digita o código no campo e pressiona Enter, simulando a leitura. No futuro, um leitor compatível configurado para atuar como teclado poderá preencher o mesmo campo e enviar Enter. Caso o leitor não envie Enter, ele poderá ser configurado ou a pessoa poderá confirmar manualmente. O código identifica o produto; nome e demais informações são cadastrados manualmente.</p><p>Ao encontrar o código, o sistema exibe o produto e o saldo. Se não encontrar, oferece cadastro com o código já preenchido. Também deverá permitir localizar um produto pelo nome e digitar o código manualmente. Para itens sem código, poderá ser gerado um código interno único e impressa uma etiqueta para o produto ou seu local de armazenamento; a emissão de etiquetas precisa ser implementada no sistema final.</p><h2>3. Cadastro de produtos</h2><p>Campos propostos: código de barras ou interno, nome, categoria, unidade de controle, estoque mínimo, local de armazenamento e situação ativo/inativo. Categorias iniciais: limpeza, higiene, escritório, copa, descartáveis e outros. Um produto começa com saldo zero; a quantidade existente é registrada por uma entrada inicial identificada no histórico. O código não deve ser duplicado. A edição preserva o histórico, e produtos já movimentados devem ser inativados em vez de apagados.</p><h2>4. Unidades, caixas e fardos</h2><p>Cada produto possui uma unidade de controle, como pacote, frasco ou unidade. O saldo é sempre guardado nessa unidade. Também são cadastradas as embalagens usadas para movimentação e o fator de conversão de cada uma, inclusive seus códigos quando existirem. Exemplo: papel higiênico, unidade de controle pacote; um fardo contém 4 pacotes. Entrada de 3 fardos acrescenta 12 pacotes; retirada de 2 pacotes desconta 2. Uma caixa de 12 frascos equivale a 12 frascos.</p><p>Na movimentação, o usuário escolhe a embalagem e a quantidade; o sistema mostra a equivalência antes da confirmação. Um código de embalagem pode identificar diretamente o produto e a embalagem correspondente. Se o código não for específico, a embalagem é escolhida manualmente. Códigos de unidades e embalagens devem ser únicos. Fatores podem variar por produto e embalagem: não presumir que todo fardo tenha o mesmo conteúdo. A conversão registrada deve permanecer no histórico mesmo que o cadastro seja alterado depois. Trocar a unidade de controle de produto já movimentado exige procedimento de migração, para não distorcer o saldo.</p><h2>5. Entrada e saída</h2><p>Na entrada, pesquisar ou bipar, conferir o produto, selecionar unidade ou embalagem, informar quantidade e responsável e confirmar. O sistema calcula o equivalente, soma ao saldo e registra data e hora. Opcionalmente, registra fornecedor, setor e observação. Na saída, o procedimento é semelhante; também pode ser informado o setor de destino. A quantidade deve ser positiva e o sistema não permite retirar mais do que o saldo existente. O saldo e o histórico são gravados juntos, para evitar divergências.</p><p>Exemplo: 10 pacotes disponíveis, retirada de 2 pacotes, saldo final de 8. Se for necessário corrigir uma movimentação, registrar um ajuste com motivo e mantendo o lançamento anterior para consulta.</p><h2>6. Consultas e relatórios</h2><p>A tela inicial apresenta atalhos e produtos com saldo igual ou inferior ao mínimo. A consulta de produtos permite pesquisa por nome, código e categoria. O histórico permite filtrar por data, produto, tipo de movimento, responsável e setor. Relatórios previstos: lista de compra com saldo e mínimo, estoque por categoria, entradas e saídas por período e consumo por produto ou setor. Impressão e exportação podem ser implementadas no programa final.</p><h2>7. Estrutura de dados sugerida</h2><ul><li><b>Produtos:</b> identificação, nome, categoria, unidade de controle, mínimo, local e situação.</li><li><b>Embalagens e códigos:</b> produto vinculado, código único, nome da embalagem e quantidade de unidades de controle. Permite unidade, caixa e fardo com fatores diferentes.</li><li><b>Movimentações:</b> produto, tipo, data e hora, quantidade informada, embalagem, fator aplicado, quantidade convertida, setor e observação. O saldo pode ser guardado no produto e atualizado junto da movimentação em uma transação.</li><li><b>Categorias:</b> nomes para classificação, caso se deseje administrá-las no sistema.</li></ul><p>A separação do código pode ter telas (Forms), modelos de dados, regras de negócio e acesso ao SQLite. A validação e a conversão ficam nas regras de negócio; o acesso ao banco fica em uma camada própria. Isso facilita a manutenção.</p><h2>8. Identificação do responsável</h2><p>O nome informado em cada movimentação identifica o responsável pelo registro. Usuários e senhas poderão ser acrescentados caso a farmácia precise controlar o acesso ao sistema.</p><h2>9. Telas previstas</h2><ol><li>Visão geral com alertas e atalhos.</li><li>Consulta e cadastro de produtos e embalagens.</li><li>Entrada e saída com leitura simulada, pesquisa e conversão.</li><li>Histórico e ajustes com motivo.</li><li>Relatórios e lista de compras.</li></ol><p>O protótipo apresenta exemplos simplificados. No sistema final ainda deverão ser implementados, entre outros, banco SQLite, persistência, cadastro de múltiplas embalagens e códigos, edição/inativação, ajustes, filtros completos e impressão.</p></article>`;

descricao += `<article class="content"><h2>10. Gestão financeira e local da compra</h2><p>O projeto passa a controlar os valores dos materiais de uso interno. Cada entrada informa a data da compra, data de recebimento, estabelecimento ou site onde foi feita a compra, fornecedor quando diferente, produto, quantidade, embalagem, preço por embalagem, desconto e acréscimo atribuídos ao item, responsável e nota ou observação. O estabelecimento é o local da compra, diferente do local de armazenamento e do setor que consome o produto. O local poderá ser cadastrado e reutilizado para evitar nomes duplicados; informar também se a compra foi em loja física ou pela internet é opcional.</p><p>O cadastro do produto apresenta o último preço pago e, opcionalmente, um preço de referência com origem e data. O preço pago pertence a cada entrada e não substitui o histórico. Se a mesma nota tiver vários itens, uma compra deverá agrupar seus itens: número, data e estabelecimento no cabeçalho; produto, embalagem, quantidade e preço em cada item. O desconto e o frete gerais deverão ser distribuídos entre os itens por critério definido, sem duplicar valores. Uma compra sem preço pode representar saldo inicial; relatórios financeiros devem indicar que seu custo é desconhecido, nunca presumir custo zero.</p><h2>11. Cálculos e exemplos</h2><p>Três fardos com quatro pacotes cada, a R$ 40 por fardo, geram 12 pacotes, total de R$ 120 e custo de R$ 10 por pacote, antes de ajustes. Na entrada, o total do item é quantidade de embalagens × preço da embalagem − desconto + acréscimo atribuído. O custo por unidade de controle é o total dividido pela quantidade convertida. Salvar o fator de conversão usado e os valores calculados na movimentação.</p><p>Economia compara o preço de referência e o preço pago para a mesma quantidade e unidade: referência total menos custo efetivo. Valores negativos significam custo adicional. Guardar referência, origem e data usadas na compra para preservar os relatórios antigos. Sem referência, apresentar “não calculada” e informar quantos itens tiveram referência. Diferença de gasto entre meses não é necessariamente economia, pois quantidades compradas podem mudar.</p><p>Gasto de compras é diferente do custo dos itens retirados para uso. Para estimar custo de consumo e estoque, usar custo médio ponderado móvel: (valor do saldo anterior + custo da nova entrada) ÷ (quantidade anterior + quantidade recebida). Registrar o custo aplicado na saída. Quando houver saldo de custo desconhecido, sinalizar a limitação e não apresentar estimativa como completa. Ajustes de estoque exigem motivo, responsável e tratamento do custo.</p><h2>12. Relatórios e indicadores</h2><ul><li><b>Visão financeira:</b> gasto mensal, mês anterior, diferença em reais e porcentagem, média do período, número de compras e itens distintos. Usar data de compra e indicar o período; um mês anterior sem compras não permite calcular percentual de variação.</li><li><b>Por local de compra:</b> total e participação no gasto, número de compras, produtos comprados, data da última compra, preço por unidade, histórico e ranking dos locais. Mostrar economia apenas onde há referência, incluindo a cobertura.</li><li><b>Por produto e categoria:</b> total gasto, quantidade comprada, preço médio comparável por unidade, produto de maior gasto e ranking. Quantidades de unidades diferentes não devem ser somadas como se fossem equivalentes.</li><li><b>Economia:</b> por mês, local, categoria e produto; apresentar economia, custo adicional e itens sem referência.</li><li><b>Consumo:</b> saídas por produto, categoria, setor, responsável e período, mais usados, produtos sem movimentação e custo estimado das saídas.</li><li><b>Estoque:</b> saldo, mínimo, local de armazenamento, produtos zerados, última entrada e saída, custo estimado e sugestão de compra baseada em estoque desejado, respeitando embalagens inteiras.</li><li><b>Histórico de preços:</b> menor, maior e último preço pago, fornecedor, local, data e variação entre compras para o mesmo produto e unidade.</li></ul><p>Filtros previstos: período, produto, categoria, local de compra, fornecedor, setor, responsável e tipo de movimento. Permitir impressão e exportação em PDF e Excel. Os relatórios financeiros usam a data da compra; entradas de estoque usam a data do recebimento. O painel inicial resume gasto do mês, comparação mensal, economia com cobertura, produto e local de maior gasto, estoque baixo e valor estimado em estoque.</p><h2>13. Estrutura de dados complementar</h2><p><b>Locais de compra e fornecedores:</b> identificação, nome e dados opcionais, permitindo associar uma compra ao estabelecimento correto. <b>Compras:</b> identificação, datas, local, fornecedor, nota, descontos e acréscimos gerais. <b>Itens da compra:</b> produto, embalagem, quantidade, fator registrado, preço, ajustes distribuídos, custo final e referência usada. <b>Movimentações:</b> entradas ligadas ao item da compra e saídas ou ajustes com data, quantidade, setor, responsável e custo aplicado. Os relacionamentos permitem registrar uma compra com vários itens sem contar cada item como uma compra diferente.</p><h2>14. Telas atualizadas</h2><p>Início com indicadores; produtos e cadastro com preço de referência; entrada com local da compra e valores; saída por produto e setor; histórico; relatórios com visão por local; e explicações nos relatórios. O protótipo demonstra um item por entrada, dados temporários e apenas alguns filtros e cálculos. Cadastro de compras com vários itens, impressão, exportação, custo médio e relatórios completos serão desenvolvidos na aplicação Windows Forms.</p></article>`;

function adicionaAjuda(el, texto){if(!texto||el.querySelector('.info-wrap'))return;let w=document.createElement('span');w.className='info-wrap';let b=document.createElement('button');b.type='button';b.className='info-btn';b.textContent='i';b.setAttribute('aria-label','Informação: '+el.textContent.trim());b.setAttribute('aria-expanded','false');let t=document.createElement('span');t.className='info-text';t.textContent=texto;b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();let aberto=w.classList.toggle('open');b.setAttribute('aria-expanded',String(aberto))});w.append(b,t);el.append(w)}
const desenhaSemAjuda=desenhaRelatorio;
desenhaRelatorio=function(){desenhaSemAjuda();document.querySelectorAll('#relconteudo .metric small, #relconteudo .panel h2').forEach(el=>{let nome=el.textContent.trim();adicionaAjuda(el,ajudaRel[nome]||'Apresenta informações referentes a '+nome.toLowerCase()+', conforme os filtros do relatório.')})};
